services:
  - type: web
    name: agronomy
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    preDeployCommand: "bundle exec rails db:migrate"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agronomy-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false          # paste from config/master.key in Render dashboard
      - key: MAPBOX_TOKEN
        sync: false
      - key: VISUAL_CROSSING_API_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "1"
      - key: RAILS_LOG_TO_STDOUT
        value: "1"

databases:
  - name: agronomy-db
    databaseName: agronomy_production
    plan: starter           # $7/mo — upgrade from free after the 90-day trial
